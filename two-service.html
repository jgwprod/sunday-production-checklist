<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Two-Service Checklist</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- ============================================================

     Change any task text or times below.
     ============================================================ -->
<script>
const CONFIG = {
  title: "Sunday Checklist",
  subtitle: "Two Services",

  sections: [
    {
      id: "pre",
      title: "Pre-Service / Worship Practice",
      time: "7:30",
      tasks: [
        "Turn on stage lights",
        "Turn on projectors",
        "Turn on TV monitors (sound booth)",
        "Turn on Fellowship Hall TV (set to input 1)",
        "Turn on back wall TV",
        "Open ProPresenter (media)",
        "Login to new MacBook Pro (Turns on Main Stream Deck) & refresh Caption Kit page",
        "Turn FTB off on switcher (allows live streaming)",
      ]
    },
    {
      id: "svc1",
      title: "Service 1",
      tasks: [
        { time: "8:45",  text: "Start welcome slides (media)" },
        { time: "8:57",  text: "Start countdown (media)" },
        { time: "9:00",  text: "Start closed captioning" },
        { time: "10:15 (or end of service)", text: "Stop closed captioning" },
      ]
    },
    {
      id: "svc2",
      title: "Service 2",
      tasks: [
        { time: "10:30", text: "Start welcome slides (media)" },
        { time: "10:39", text: "Start stream (at 'Welcome slide')" },
        { time: "10:42", text: "Start countdown (media)" },
        { time: "10:45", text: "Start closed captioning" },
        { time: "12:15 (or end of service)", text: "Stop closed captioning. After announcement slides go once through, wait 10 seconds after 'Thanks for Coming' slide shows, then select FTB (fade to black), wait for 10 seconds, then stop stream, then turn FTB off so announcement slides run in fellowship hall." },
      ]
    },
    {
      id: "post",
      title: "30 Min After Service",
      tasks: [
        "Turn on FTB (switcher)",
        "Turn off TV monitors",
        "Turn off Fellowship Hall TV",
        "Turn off back wall TV",
        "Turn off projectors",
        "Turn off stage lights",
      ]
    }
  ]
};
</script>
<!-- ============================================================
     END OF EDITABLE SECTION
     ============================================================ -->

<style>
  :root {
    --bg: #f3f1ea;
    --surface: #ffffff;
    --surface-2: #faf8f2;
    --border: #e5dfd0;
    --ink: #1c1b17;
    --ink-2: #726d5e;
    --ink-3: #9d9885;
    --accent: #c4432a;
    --accent-ink: #ffffff;
    --success: #1a8f52;
    --success-bg: #eaf7ee;
    --success-border: #a9dfba;
    --shadow: 0 1px 2px rgba(28, 27, 23, 0.06), 0 1px 8px rgba(28, 27, 23, 0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171613;
      --surface: #211f1b;
      --surface-2: #29271f;
      --border: #38352c;
      --ink: #f3f1e8;
      --ink-2: #a8a290;
      --ink-3: #7a7566;
      --accent: #e0654a;
      --accent-ink: #1a0e08;
      --success: #3ddc84;
      --success-bg: #16281c;
      --success-border: #245c37;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.2);
    }
  }

  :root[data-theme="dark"] {
    --bg: #171613;
    --surface: #211f1b;
    --surface-2: #29271f;
    --border: #38352c;
    --ink: #f3f1e8;
    --ink-2: #a8a290;
    --ink-3: #7a7566;
    --accent: #e0654a;
    --accent-ink: #1a0e08;
    --success: #3ddc84;
    --success-bg: #16281c;
    --success-border: #245c37;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 8px rgba(0,0,0,0.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 64px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 22px 20px 18px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
  }

  .header-titles h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .header-titles p {
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 2px;
  }

  .tally {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink-3);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .tally-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-3);
    transition: background 0.2s;
  }
  .tally-dot.live { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .tally-dot.clear { background: var(--success); }

  .progress-bar {
    height: 5px;
    background: var(--border);
    margin-top: 14px;
    border-radius: 999px;
    overflow: hidden;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
  .progress-fill {
    height: 100%;
    background: var(--success);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-3);
    margin-top: 7px;
    display: block;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    font-variant-numeric: tabular-nums;
  }

  main { padding: 16px; max-width: 600px; margin: 0 auto; }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    -webkit-tap-highlight-color: transparent;
  }
  .section-header:active { filter: brightness(0.97); }

  .section-left { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .section-title { font-size: 14.5px; font-weight: 600; color: var(--ink); }
  .section-time {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .section-badge {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: var(--ink-2);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .section-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .section-chevron { font-size: 11px; color: var(--ink-3); transition: transform 0.2s; }
  .section-chevron.open { transform: rotate(90deg); }

  .section-body { padding: 4px 0; }
  .section-body.collapsed { display: none; }

  .time-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    padding: 10px 16px 4px;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 12px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s;
    border-top: 1px solid var(--border);
  }
  .task:first-of-type { border-top: none; }
  .time-label + .task { border-top: none; }
  .task:active { background: var(--surface-2); }

  .checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    margin-top: 1px;
  }
  .checkbox.checked {
    background: var(--success);
    border-color: var(--success);
  }
  .checkmark { display: none; }
  .checkbox.checked .checkmark { display: block; }

  .task-text {
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.45;
    flex: 1;
  }
  .task-text.done {
    text-decoration: line-through;
    color: var(--ink-3);
  }

  .reset-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    text-align: center;
    margin-top: 6px;
    font-family: inherit;
  }
  .reset-btn:active { background: var(--surface-2); }

  .done-banner {
    display: none;
    background: var(--success-bg);
    border: 1.5px solid var(--success-border);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    margin-bottom: 12px;
  }
  .done-banner.visible { display: block; }
  .done-banner h2 { font-size: 15px; color: var(--success); font-weight: 700; }
  .done-banner p  { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>


</head>
<body>
<header>
  <div class="header-row">
    <div class="header-titles">
      <h1 id="page-title"></h1>
      <p id="page-subtitle"></p>
    </div>
    <div class="tally">
      <span class="tally-dot" id="tally-dot"></span>
      <span id="tally-label">Standby</span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
  <span class="progress-label" id="prog-label">0 / 0 complete</span>
</header>

<main>
  <div class="done-banner" id="done-banner">
    <h2>All done — great work today</h2>
    <p>Everything on the list is wrapped up.</p>
  </div>
  <div id="sections-root"></div>
  <button class="reset-btn" id="reset-btn">↺ Reset checklist</button>
</main>

<script>
document.getElementById("page-title").textContent = CONFIG.title;
document.getElementById("page-subtitle").textContent = CONFIG.subtitle;

const STORAGE_KEY = "checklist-state-" + CONFIG.subtitle.replace(/\s+/g, "-").toLowerCase();

const state = {};
const openSections = {};
let saved = {};
try {
  saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
} catch (e) { saved = {}; }

CONFIG.sections.forEach(s => {
  openSections[s.id] = true;
  s.tasks = s.tasks.map((task, i) => {
    const obj = typeof task === "string" ? { text: task } : task;
    obj._key = s.id + "_" + i;
    state[obj._key] = !!saved[obj._key];
    return obj;
  });
});

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function total() { return Object.keys(state).length; }
function done()  { return Object.values(state).filter(Boolean).length; }

function sectionCount(s) {
  let d = 0, t = s.tasks.length;
  s.tasks.forEach(task => { if (state[task._key]) d++; });
  return d + "/" + t;
}

function updateProgress() {
  const t = total(), d = done();
  const pct = t ? Math.round(d / t * 100) : 0;
  document.getElementById("prog-fill").style.width = pct + "%";
  document.getElementById("prog-label").textContent = d + " / " + t + " complete";
  document.getElementById("done-banner").classList.toggle("visible", d === t && t > 0);

  const dot = document.getElementById("tally-dot");
  const label = document.getElementById("tally-label");
  dot.className = "tally-dot";
  if (d === t && t > 0) {
    dot.classList.add("clear");
    label.textContent = "Clear";
  } else if (d > 0) {
    dot.classList.add("live");
    label.textContent = "In progress";
  } else {
    label.textContent = "Standby";
  }
}

function render() {
  const root = document.getElementById("sections-root");
  root.innerHTML = "";

  CONFIG.sections.forEach(s => {
    const sec = document.createElement("div");
    sec.className = "section";

    const hdr = document.createElement("div");
    hdr.className = "section-header";
    hdr.setAttribute("role", "button");
    hdr.setAttribute("tabindex", "0");
    hdr.setAttribute("aria-expanded", openSections[s.id] ? "true" : "false");
    hdr.innerHTML = `
      <div class="section-left">
        <span class="section-title">${s.title}</span>
        ${s.time ? `<span class="section-time">${s.time}</span>` : ""}
      </div>
      <div class="section-right">
        <span class="section-badge" id="badge-${s.id}">${sectionCount(s)}</span>
        <span class="section-chevron ${openSections[s.id] ? 'open' : ''}" id="chev-${s.id}">▶</span>
      </div>
    `;
    const toggle = () => { openSections[s.id] = !openSections[s.id]; render(); };
    hdr.onclick = toggle;
    hdr.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    sec.appendChild(hdr);

    const body = document.createElement("div");
    body.className = "section-body" + (openSections[s.id] ? "" : " collapsed");

    s.tasks.forEach(task => {
      const key = task._key;
      const text = task.text;
      const time = task.time || null;

      if (time) {
        const lbl = document.createElement("div");
        lbl.className = "time-label";
        lbl.textContent = time;
        body.appendChild(lbl);
      }

      const row = document.createElement("div");
      row.className = "task";
      row.setAttribute("role", "checkbox");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-checked", state[key] ? "true" : "false");
      const toggleTask = () => { state[key] = !state[key]; persist(); render(); updateProgress(); };
      row.onclick = toggleTask;
      row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleTask(); } };

      row.innerHTML = `
        <div class="checkbox ${state[key] ? 'checked' : ''}">
          <svg class="checkmark" width="12" height="9" viewBox="0 0 13 10">
            <path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="task-text ${state[key] ? 'done' : ''}">${text}</span>
      `;
      body.appendChild(row);
    });

    sec.appendChild(body);
    root.appendChild(sec);
  });

  updateProgress();
}

document.getElementById("reset-btn").onclick = () => {
  if (!confirm("Reset the entire checklist?")) return;
  Object.keys(state).forEach(k => state[k] = false);
  CONFIG.sections.forEach(s => openSections[s.id] = true);
  persist();
  render();
};

render();
</script>
</body>
</html>
